<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gappy // AIRGAP CONTROL</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="hdr">
      <div class="brand">G&nbsp;A&nbsp;P&nbsp;P&nbsp;Y <span class="sub">// AIRGAP CONTROL</span><span class="ver" id="appVersion"></span></div>
      <div class="hdr-stats" id="storeSummary">
        <span><b id="sCount">0</b> img</span>
        <span class="dot">·</span>
        <span><b id="sCharts">0</b> chart</span>
        <span class="dot">·</span>
        <span><b id="sSize">0 B</b></span>
        <span class="dot">·</span>
        <span><b id="sArch">0</b> arch</span>
      </div>
      <div class="hdr-reg" id="regStatus" title="serve loads the store here; the registry also accepts docker push"><span class="led"></span> :5000 <b id="regState">IDLE</b></div>
    </header>

    <main class="grid">
      <section class="left">
        <div class="panel browse">
          <div class="panel-title">STORE <span class="path" id="storePath">./store</span></div>
          <div class="search-wrap">
            <span class="search-ps1">/</span>
            <input id="search" placeholder="filter…" autocomplete="off" autocapitalize="off" spellcheck="false">
          </div>
          <div class="cards" id="cards"><div class="empty">scanning store…</div></div>
        </div>
        <div class="panel add">
          <div class="panel-title">ADD IMAGE</div>
          <div class="prompt">
            <span class="ps1">$&nbsp;pull</span>
            <input id="ref" placeholder="redis:alpine" autocomplete="off" autocapitalize="off" spellcheck="false">
            <span class="caret" id="caret">▌</span>
          </div>
          <div class="btns">
            <button id="packBtn" class="btn pack">▸ PACK</button>
            <button id="unpackBtn" class="btn unpack">⇡ UNPACK ALL</button>
          </div>
        </div>
      </section>

      <section class="right">
        <div class="panel transit">
          <div class="panel-title">
            TRANSIT
            <span class="mode" id="transitMode">IDLE</span>
            <span class="plats" id="transitPlats"></span>
            <span class="ref" id="transitRef"></span>
          </div>
          <canvas id="stage"></canvas>
        </div>
        <div class="panel chart">
          <div class="panel-title">THROUGHPUT <span class="mono right" id="bpsLabel">0 B/s</span></div>
          <canvas id="chart"></canvas>
        </div>
        <div class="panel lanes-panel">
          <div class="panel-title">LAYERS <span class="mono right" id="lanesCount"></span></div>
          <div class="lanes" id="lanes"><div class="empty">idle</div></div>
        </div>
        <div class="panel log-panel">
          <div class="panel-title">LOG</div>
          <div class="log" id="log"></div>
        </div>
      </section>
    </main>

    <footer class="strip" id="strip">
      <span>RECV&nbsp;<b id="mRecv">0 B</b></span>
      <span class="sep">░</span>
      <span>TOTAL&nbsp;<b id="mTotal">0 B</b></span>
      <span class="sep">░</span>
      <span id="mBlobsLabel">BLOBS</span>&nbsp;<b id="mBlobs">0/0</b>
      <span class="sep">░</span>
      <span>ETA&nbsp;<b id="mEta">--:--</b></span>
      <span class="sep">░</span>
      <span><b id="mBps">0 B/s</b></span>
      <span class="sep">░</span>
      <span>LANES&nbsp;<b id="mLanes">0</b></span>
    </footer>
  </div>
  <!-- image detail modal -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-bd" id="modalBd"></div>
    <div class="modal-panel">
      <div class="modal-hdr">
        <span class="modal-label">IMAGE</span>
        <span class="modal-ref" id="modalRef"></span>
        <span class="modal-digest" id="modalDigest"></span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-plats" id="modalPlats"></div>
      <div class="modal-body">
        <div class="modal-section">
          <div class="modal-sec-title">LAYERS <span id="modalLayerCount"></span></div>
          <div id="modalLayers"></div>
        </div>
        <div class="modal-section" id="modalCfgSection">
          <div class="modal-sec-title">CONFIG</div>
          <div class="modal-cfg" id="modalCfg"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
